services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/var/www/html
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  node:
    image: node:22-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "5174:5173"
    volumes:
      - .:/var/www/html
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "8027:8025"
    restart: unless-stopped
